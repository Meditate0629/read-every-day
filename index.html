<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>读书计划 · 手机版</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<meta name="theme-color" content="#2F6B4F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="读书计划">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<svg width="0" height="0" style="display:none" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.6 12 3.2l9 7.4"/><path d="M5.6 9.6V20h12.8V9.6"/><path d="M9.8 20v-5.4h4.4V20"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15.5" rx="2.4"/><path d="M3 10h18M8 3.2v3.6M16 3.2v3.6"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6.2 3.2h8.4l4.2 4.2v13.4H6.2z"/><path d="M14.6 3.2v4.2h4.2"/><path d="M9.2 12.4h6.2M9.2 16h4.2"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.4V12l3.1 2"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6.3 9.4a5.7 5.7 0 0 1 11.4 0c0 4.6 1.9 5.8 1.9 5.8H4.4s1.9-1.2 1.9-5.8Z"/><path d="M10.2 19a2 2 0 0 0 3.6 0"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3.2" y="4.4" width="17.6" height="15.2" rx="2.4"/><circle cx="9" cy="10.2" r="1.6"/><path d="M5 19.2l5.2-5.2 3 3 3-3 3.2 3.2"/></symbol>
  <symbol id="i-cog" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2.1" fill="var(--surface)"/><circle cx="15" cy="12" r="2.1" fill="var(--surface)"/><circle cx="8" cy="17" r="2.1" fill="var(--surface)"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><circle cx="11" cy="11" r="6.4"/><path d="M15.8 15.8 20 20"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.4A8.2 8.2 0 0 1 9.6 4 8.4 8.4 0 1 0 20 14.4Z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M4.4 4.4l1.6 1.6M18 18l1.6 1.6M2.6 12h2.2M19.2 12h2.2M4.4 19.6 6 18M18 6l1.6-1.6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.6"/><path d="M12 11v5.4M12 7.8v.6"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.6 21.2 19.4H2.8z"/><path d="M12 9.8v4.4M12 17.2v.4"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.6 9.6 17.2 19 7.8"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.6v12.2M7.4 11.4 12 16l4.6-4.6M4.4 20.4h15.2"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.4V8.2M7.4 12.6 12 8l4.6 4.6M4.4 3.6h15.2"/></symbol>
</svg>

<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-dot"></span>读书计划 · 手机版</div>
    <button class="btn btn-primary btn-block" id="btnNew">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-linecap="round"><use href="#i-plus"/></svg> 新建
    </button>
    <button class="btn btn-block" id="btnPalette" style="justify-content:flex-start;color:var(--text-2)">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-linecap="round"><use href="#i-search"/></svg> 搜索…
      <span class="spacer"></span><kbd style="font-size:11px;border:1px solid var(--border);border-radius:4px;padding:0 5px">Ctrl K</kbd>
    </button>
    <nav class="nav" id="nav">
      <a class="nav-item" href="#/home"><svg><use href="#i-home"/></svg>首页</a>
      <a class="nav-item" href="#/plan"><svg><use href="#i-cal"/></svg>计划</a>
      <a class="nav-item" href="#/notes"><svg><use href="#i-note"/></svg>笔记</a>
      <a class="nav-item" href="#/timer"><svg><use href="#i-clock"/></svg>计时</a>
      <a class="nav-item" href="#/reminders"><svg><use href="#i-bell"/></svg>提醒</a>
      <a class="nav-item" href="#/share"><svg><use href="#i-share"/></svg>分享</a>
      <a class="nav-item" href="#/settings"><svg><use href="#i-cog"/></svg>设置</a>
    </nav>
    <div class="sidebar-foot">
      <div id="miniTimer"></div>
      <div id="sideStatus"></div>
    </div>
  </aside>

  <main class="main" id="view"></main>
</div>

<div id="reminderDock" class="dock"></div>
<div id="toast" class="toast" hidden></div>

<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/backup.js"></script>
<script src="js/data.js"></script>
<script src="js/pdf.js"></script>
<script src="js/share.js"></script>
<script src="js/pages.js"></script>
<script src="js/timer.js"></script>
<script src="js/reminders.js"></script>
<script src="js/pages.plan.js"></script>
<script src="js/pages.home.js"></script>
<script src="js/pages.notes.js"></script>
<script src="js/pages.timer.js"></script>
<script src="js/pages.reminders.js"></script>
<script src="js/pages.share.js"></script>
<script src="js/main.js"></script>
<script src="js/palette.js"></script>
<script src="js/selftest.js"></script>
<script>
  /* 离线缓存：只在 https 下注册。
     本地预览（127.0.0.1）不注册，免得缓存挡着改代码。 */
  if (location.protocol === 'https:' && 'serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () { });
  }
</script>
</body>
</html>
