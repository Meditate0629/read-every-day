<div class="app">

    <div class="brand"><span class="brand-dot"></span>Read Every Day</div>

    </button>
    <button class="btn btn-block" id="btnPalette" style="justify-content:flex-start;color:var(--text-2)">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-linecap="round"><use href="#i-search"/></svg> 搜索…
      <span class="spacer"></span><kbd style="font-size:11px;border:1px solid var(--border);border-radius:4px;padding:0 5px">Ctrl K</kbd>
    </button>

      <a class="nav-item" href="#/home" data-icon="home"><svg><use href="#i-home"/></svg>首页</a>
      <a class="nav-item" href="#/plan" data-icon="cal"><svg><use href="#i-cal"/></svg>计划</a>
      <a class="nav-item" href="#/notes" data-icon="note"><svg><use href="#i-note"/></svg>笔记</a>
      <a class="nav-item" href="#/timer" data-icon="clock"><svg><use href="#i-clock"/></svg>计时</a>
      <a class="nav-item" href="#/reminders" data-icon="bell"><svg><use href="#i-bell"/></svg>提醒</a>
      <a class="nav-item" href="#/share" data-icon="share"><svg><use href="#i-share"/></svg>分享</a>
      <a class="nav-item" href="#/settings" data-icon="cog"><svg><use href="#i-cog"/></svg>设置</a>
    </nav>
